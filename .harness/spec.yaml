schemaVersion: 2

name: safe-treasury-rebalance
description: >
  Regression recipe for the finished hedera-safe-swap template: a Safe
  multisig treasury on Hedera with a quorum-gated RebalanceModule (SaucerSwap
  V1), a Chainlink/Supra price-guarded module, and HCS-relayed proposals.
  Validates that the deployed contracts,
  test suite, and frontend dashboard all still work — install, build, lint,
  test, and a Playwright boot check of the real UI.

agent: claude

baseline:
  commands:
    - name: install
      command: npm install
    - name: build
      command: npm run build

constraints:
  packageManager: npm
  workspaces:
    - packages/contracts
    - packages/frontend

validators:
  static: .harness/validators/static.json
  commands: .harness/validators/npm.json
  playwright: .harness/validators/playwright-smoke.yaml

# Tier 3.5 on-chain validation (chainValidation) is not enabled here. It injects an ephemeral
# funded signer as a browser localStorage "burner wallet" for Playwright to drive — our frontend
# only supports real EIP-1193 wallets (lib/wallet.ts), with no burner-wallet connector, so this
# tier isn't wired up. The real on-chain proof for this template instead comes from
# packages/contracts/scripts/demo-rebalance.ts, run directly against Hedera testnet — see the
# "Verified testnet transaction" section in README.md for the resulting Hashscan links.
#
# chainValidation:
#   enabled: true
#   network: testnet
#   operator:
#     accountIdEnv: HEDERA_OPERATOR_ID
#     privateKeyEnv: HEDERA_OPERATOR_KEY
